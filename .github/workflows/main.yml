name: Build PicoFlasher UF2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Toolchain & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

    - name: Get Pico SDK
      run: git clone https://github.com/raspberrypi/pico-sdk.git --recursive

    - name: Build Project
      run: |
        export PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk
        mkdir build
        cd build
        cmake -G Ninja ..
        ninja

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PicoFlasher-Custom
        path: build/*.uf2
