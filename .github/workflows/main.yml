name: Build PicoFlasher UF2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Set up Arm GNU Toolchain
      uses: meiyao/arm-none-eabi-gcc-action@v1
      with:
        release: '12.2.rel1'

    - name: Install CMake & Ninja
      run: sudo apt-get install -y cmake ninja-build

    - name: Get Pico SDK
      run: git clone https://github.com/raspberrypi/pico-sdk.git --recursive

    - name: Build Project
      run: |
        export PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk
        mkdir build
        cd build
        cmake -G Ninja ..
        ninja

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v3
      with:
        name: PicoFlasher-Custom
        path: build/*.uf2
